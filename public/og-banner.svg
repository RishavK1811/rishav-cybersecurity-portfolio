<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0e" />
      <stop offset="50%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>

    <linearGradient id="accent-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="lavender-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b5a0f2" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Radial Ambient Glows -->
    <radialGradient id="glow-cyan" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#090a0e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-emerald" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#090a0e" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.05" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Base Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Cyber Grid Overlay -->
  <rect width="1200" height="630" fill="url(#cyber-grid)" />

  <!-- Ambient Glow Blobs -->
  <rect width="1200" height="630" fill="url(#glow-cyan)" />
  <rect width="1200" height="630" fill="url(#glow-emerald)" />

  <!-- Outer Cyber Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
  <rect x="23" y="23" width="1154" height="584" rx="17" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.18" />

  <!-- Top Decorative Coordinates -->
  <text x="64" y="68" fill="#64748b" font-family="'DM Mono', monospace, Consolas" font-size="12" letter-spacing="1.5">NODE // PATNA_IN [25.5941° N, 85.1376° E] — PROTOCOL: TLS 1.3</text>
  <text x="1136" y="68" fill="#38bdf8" font-family="'DM Mono', monospace, Consolas" font-size="12" letter-spacing="1.5" text-anchor="end">SYS.VER: 2026.4</text>

  <!-- Status Pill Header -->
  <g transform="translate(64, 100)">
    <rect width="470" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="20" cy="17" r="5" fill="#10b981" filter="url(#neon-glow)" />
    <circle cx="20" cy="17" r="3" fill="#34d399" />
    <text x="36" y="22" fill="#34d399" font-family="'DM Mono', monospace, Consolas" font-size="12" font-weight="600" letter-spacing="1.2">
      STATUS: AVAILABLE · SOC &amp; BLUE TEAM ROLES
    </text>
  </g>

  <!-- Central Security Emblem / Shield Illustration on Right Side -->
  <g transform="translate(850, 150)" filter="url(#card-shadow)">
    <!-- Circuit Lines Background -->
    <path d="M -80 150 L 0 150 L 50 100 L 150 100" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <path d="M 0 240 L 80 240 L 140 180" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 4" />

    <!-- Outer Shield Halo -->
    <path d="M 120 20 L 220 60 C 220 180, 160 250, 120 270 C 80 250, 20 180, 20 60 Z"
          fill="#090d16" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" />

    <!-- Inner Shield Glowing Body -->
    <path d="M 120 40 L 200 75 C 200 170, 150 230, 120 248 C 90 230, 40 170, 40 75 Z"
          fill="#0f172a" fill-opacity="0.85" stroke="url(#accent-cyan-grad)" stroke-width="2.5" />

    <!-- Core Security Symbol: Shield Node Lock -->
    <circle cx="120" cy="130" r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <path d="M 112 130 L 117 135 L 130 122" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Terminal Code Matrix Inside Emblem -->
    <rect x="75" y="175" width="90" height="22" rx="4" fill="#090a0e" stroke="#334155" stroke-width="1" />
    <text x="120" y="190" fill="#38bdf8" font-family="'DM Mono', monospace, Consolas" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">DEFENSE_OK</text>
  </g>

  <!-- Candidate Name & Main Headline -->
  <g transform="translate(64, 185)">
    <!-- Brand Tag -->
    <text x="0" y="0" fill="#38bdf8" font-family="'DM Mono', monospace, Consolas" font-size="15" font-weight="700" letter-spacing="2.5">
      &gt; DEFENSIVE CYBERSECURITY &amp; SYSTEMS
    </text>

    <!-- Candidate Main Name -->
    <text x="0" y="65" fill="#f8fafc" font-family="'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">
      Rishav Kumar
    </text>

    <!-- Subtitle / Discipline -->
    <text x="0" y="118" fill="url(#lavender-grad)" font-family="'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">
      Cybersecurity Analyst &amp; Blue Team Portfolio
    </text>

    <!-- Bio / Value Proposition -->
    <text x="0" y="165" fill="#94a3b8" font-family="'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">
      BCA Student (2025–2028) · Defensive Security, SOC Analysis &amp; Python Automation
    </text>
  </g>

  <!-- 3 Impact Pillars / Skills Cards -->
  <g transform="translate(64, 400)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect width="215" height="76" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2" />
      <rect x="0" y="0" width="3" height="76" rx="1.5" fill="#38bdf8" />
      <text x="16" y="28" fill="#38bdf8" font-family="'DM Mono', monospace, Consolas" font-size="11" font-weight="700" letter-spacing="1">ROLE DOMAIN</text>
      <text x="16" y="52" fill="#f1f5f9" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">SOC Analyst L1</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(235, 0)" filter="url(#card-shadow)">
      <rect width="245" height="76" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2" />
      <rect x="0" y="0" width="3" height="76" rx="1.5" fill="#10b981" />
      <text x="16" y="28" fill="#34d399" font-family="'DM Mono', monospace, Consolas" font-size="11" font-weight="700" letter-spacing="1">CORE TOOLING</text>
      <text x="16" y="52" fill="#f1f5f9" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">Python · Linux · Wireshark</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(500, 0)" filter="url(#card-shadow)">
      <rect width="255" height="76" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2" />
      <rect x="0" y="0" width="3" height="76" rx="1.5" fill="#b5a0f2" />
      <text x="16" y="28" fill="#c084fc" font-family="'DM Mono', monospace, Consolas" font-size="11" font-weight="700" letter-spacing="1">CREDENTIALS</text>
      <text x="16" y="52" fill="#f1f5f9" font-family="'Manrope', sans-serif" font-size="15" font-weight="700">Google Cyber · CLLMSP (82%)</text>
    </g>
  </g>

  <!-- Footer Metadata Bar -->
  <g transform="translate(64, 545)">
    <!-- Canonical URL Badge -->
    <rect width="395" height="30" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="19" fill="#38bdf8" font-family="'DM Mono', monospace, Consolas" font-size="12" font-weight="600">
      🌐 https://rishavkumarportfolio.vercel.app/
    </text>

    <!-- Contact Direct Email Tag -->
    <g transform="translate(415, 0)">
      <rect width="365" height="30" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="19" fill="#94a3b8" font-family="'DM Mono', monospace, Consolas" font-size="12">
        ✉ rishavkumar181101@gmail.com
      </text>
    </g>

    <!-- Verification Checkmark Pill -->
    <g transform="translate(1072, 0)">
      <rect x="-105" y="0" width="105" height="30" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
      <text x="-52" y="19" fill="#34d399" font-family="'DM Mono', monospace, Consolas" font-size="11" font-weight="700" text-anchor="middle">
        VERIFIED
      </text>
    </g>
  </g>
</svg>
